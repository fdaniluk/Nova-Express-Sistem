  <style>
    /* Semaforo del encabezado: tres contadores grandes. El rojo manda. */
    .salud-semaforo { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.2rem; }
    .salud-tile {
      flex: 1 1 160px; background: #fff; border: 1px solid var(--color-border);
      border-radius: var(--radius); padding: 0.9rem 1.1rem; border-left-width: 4px;
    }
    .salud-tile .tile-num { font-size: 2rem; font-weight: 700; line-height: 1.1; }
    .salud-tile .tile-label {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--color-muted);
    }
    .salud-tile.rojo  { border-left-color: var(--color-danger); }
    .salud-tile.rojo  .tile-num { color: var(--color-danger); }
    .salud-tile.ambar { border-left-color: var(--color-accent); }
    .salud-tile.ambar .tile-num { color: #b45309; }
    .salud-tile.ok    { border-left-color: var(--color-success); }
    .salud-tile.ok    .tile-num { color: var(--color-success); }
    .salud-tile.error { border-left-color: #7c3aed; }
    .salud-tile.error .tile-num { color: #7c3aed; }

    .salud-grupo-titulo {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--color-muted); margin: 1.6rem 0 0.6rem;
    }

    .chequeo {
      background: #fff; border: 1px solid var(--color-border); border-left-width: 4px;
      border-radius: var(--radius); margin-bottom: 0.7rem; overflow: hidden;
    }
    .chequeo.rojo  { border-left-color: var(--color-danger); }
    .chequeo.ambar { border-left-color: var(--color-accent); }
    .chequeo.ok    { border-left-color: var(--color-success); }
    .chequeo.error { border-left-color: #7c3aed; }

    .chequeo-head {
      display: flex; align-items: flex-start; gap: 0.8rem;
      padding: 0.85rem 1rem; cursor: pointer;
    }
    .chequeo-head:hover { background: #fafbfc; }
    .chequeo.ok .chequeo-head { cursor: default; }
    .chequeo-punto {
      width: 10px; height: 10px; border-radius: 50%; margin-top: 0.42rem; flex: none;
    }
    .chequeo.rojo  .chequeo-punto { background: var(--color-danger); }
    .chequeo.ambar .chequeo-punto { background: var(--color-accent); }
    .chequeo.ok    .chequeo-punto { background: var(--color-success); }
    .chequeo.error .chequeo-punto { background: #7c3aed; }
    .chequeo-texto { flex: 1; min-width: 0; }
    .chequeo-titulo { font-weight: 600; }
    .chequeo-resumen { font-size: 0.86rem; color: var(--color-muted); margin-top: 0.2rem; }
    .chequeo-derecha { display: flex; align-items: center; gap: 0.7rem; flex: none; }
    .chequeo-monto { font-weight: 700; color: var(--color-danger); white-space: nowrap; }
    .chequeo-flecha { color: var(--color-muted); font-size: 0.8rem; }

    .chequeo-cuerpo { display: none; padding: 0 1rem 1rem; }
    .chequeo.abierto .chequeo-cuerpo { display: block; }
    .chequeo-cuerpo table { width: 100%; font-size: 0.85rem; }
    .chequeo-acciones {
      margin-top: 0.7rem; display: flex; gap: 0.6rem; align-items: center;
      font-size: 0.85rem; color: var(--color-muted);
    }
    .chequeo-error {
      background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: var(--radius);
      padding: 0.6rem 0.8rem; font-size: 0.85rem; margin-bottom: 0.6rem;
    }
    .salud-pie { margin-top: 1.6rem; font-size: 0.8rem; color: var(--color-muted); }
  </style>
</head>
