    .usuarios-form-grid {

      gap: 0.75rem 1rem;
      align-items: end;
    }
    .usuarios-form-grid .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.45rem;
    }
    .usuarios-form-grid .checkbox-group label {
      font-weight: 500;
      cursor: pointer;
      margin: 0;
    }
    .inline-select {
      padding: 0.25rem 0.4rem;
      font-size: 0.85rem;
      border: 1px solid var(--color-border, #d1d5db);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      max-width: 140px;
    }
    .tabla-usuarios td { vertical-align: middle; }
    .tabla-usuarios .actions-cell { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
    .estado-cell { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  </style>

  <div class="page-content">
    <div class="page-header">
      <h1>Usuarios</h1>
    </div>

    <div class="page-body">
      <div id="alert-box"></div>

      <div class="card">
        <h2>Crear usuario</h2>
        <form id="form-usuario">
          <div class="usuarios-form-grid">
            <div class="form-group">
              <label for="u-usuario">Usuario *</label>
              <input type="text" id="u-usuario" autocomplete="off" required>
            </div>
            <div class="form-group">
              <label for="u-password">Contraseña *</label>
              <input type="password" id="u-password" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="form-group">
              <label for="u-rol">Rol *</label>
              <select id="u-rol">
                <option value="empleado">Empleado</option>
                <option value="admin">Administrador</option>
              </select>
            </div>
            <div class="form-group checkbox-group">
              <input type="checkbox" id="u-ver-dashboard">
              <label for="u-ver-dashboard">Puede ver el Dashboard</label>
            </div>
            <div class="form-group checkbox-group">
              <input type="checkbox" id="u-editar-config">
              <label for="u-editar-config">Puede editar la configuración</label>
            </div>
            <div class="form-group checkbox-group">
              <input type="checkbox" id="u-ver-salud">
              <label for="u-ver-salud">Puede ver la Salud del sistema</label>
            </div>
            <div class="form-group checkbox-group">
              <input type="checkbox" id="u-cerrar-mes">
              <label for="u-cerrar-mes">Puede hacer el cierre de mes (bajar la planilla del periodo)</label>
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-primary">Crear usuario</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Usuarios del sistema</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Rol</th>
                <th style="text-align:center">Dashboard</th>
                <th style="text-align:center">Config</th>
                <th style="text-align:center">Salud</th>
                <th style="text-align:center">Cierre</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-usuarios" class="tabla-usuarios">
              <tr><td colspan="7" class="empty">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
